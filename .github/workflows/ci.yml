# kiln builds itself: this runs in a fresh VM on the kiln box.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Never run pull requests from forks on self-hosted hardware.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, kiln]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal -c clippy,rustfmt
      - name: Format
        run: . "$HOME/.cargo/env" && cargo fmt --check
      - name: Lint
        run: . "$HOME/.cargo/env" && cargo clippy --locked --tests -- -D warnings
      - name: Test
        run: . "$HOME/.cargo/env" && cargo test --locked
      - name: Dashboard script
        run: sed -n '/<script>/,/<\/script>/p' src/dashboard.html | sed '1d;$d' > "$RUNNER_TEMP/dashboard.js" && node --check "$RUNNER_TEMP/dashboard.js"
