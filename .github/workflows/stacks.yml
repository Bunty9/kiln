name: Stacks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - examples/**
      - .github/workflows/stacks.yml
  pull_request:
    paths:
      - examples/**
      - .github/workflows/stacks.yml

jobs:
  node-postgres:
    runs-on: [self-hosted, kiln]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: examples/node-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  python-uv:
    runs-on: [self-hosted, kiln]
    defaults:
      run:
        working-directory: examples/python-uv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with pytest pytest -q

  go:
    runs-on: [self-hosted, kiln]
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/go/go.mod
          cache: false
      - run: go test ./...

  docker-build:
    runs-on: [self-hosted, kiln]
    defaults:
      run:
        working-directory: examples/docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: examples/docker-build
          push: false
          load: true
          tags: kiln-test:latest
      - run: docker run --rm kiln-test:latest

  playwright:
    runs-on: [self-hosted, kiln]
    defaults:
      run:
        working-directory: examples/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  rust:
    runs-on: [self-hosted, kiln]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
