# Lint and test kiln on Apple Silicon (GitHub-hosted macos-14). Runs on every pull request that
# touches the code or the workflows (macOS minutes are free for public repos), and from the Actions
# tab (workflow_dispatch). It only compiles and runs unit tests: it cannot boot VMs (no nested
# virtualization on hosted runners); see docs/apple-silicon.md for the real-Mac checklist.
name: macos
on:
  workflow_dispatch:
  pull_request:
    paths: ["src/**", "assets/**", "guest/**", "Cargo.*", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal -c clippy && rustup default stable
      - name: Install bash 5 # the guest-script tests need bash >= 5.1; /bin/bash is 3.2
        run: brew install bash
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
