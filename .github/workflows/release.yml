# Tag vX.Y.Z on a main commit to publish a release. Built on kiln itself (Ubuntu 24.04 VMs):
# kiln-X.Y.Z-x86_64-linux.tar.gz needs glibc 2.39+ (Ubuntu 24.04, Debian 13 or newer);
# kiln-X.Y.Z-x86_64-linux-musl.tar.gz is fully static and runs on any x86_64 Linux.
# kiln-X.Y.Z-aarch64-macos.tar.gz (Apple Silicon) is built on a GitHub-hosted macos-14 runner, only
# while the repository variable KILN_MACOS_RELEASE is "true" (see docs/apple-silicon.md).
# Each tarball has a .sha256 and a .sig (raw Ed25519 signature of the tarball's bytes);
# running kilns install only releases signed with the key whose public half is in src/update.rs.
#
# Two jobs, two fresh VMs. `build` (and `build-macos`) compile (build scripts, proc macros, rustup)
# and never see the key. `sign` runs no project code: it signs the built tarballs with the key from
# the `release` environment (deployable from v* tags only), verifies them and publishes.
name: release
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: [self-hosted, kiln]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main and matches Cargo.toml
        # Guards against tagging the wrong commit; not a security boundary (a tag push runs the
        # workflow file of the tagged commit). Who may push v* tags is what protects the key.
        run: |
          # fetch-depth: 0 above already fetched every branch, origin/main included.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $want"; exit 1; }
      - name: Install Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env" && rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -q && sudo apt-get install -y musl-tools
      - name: Build
        env:
          # ring's C code; cc-rs would otherwise look for x86_64-linux-musl-gcc first.
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked && ./target/release/kiln --version
          cargo build --release --locked --target x86_64-unknown-linux-musl
          bin=target/x86_64-unknown-linux-musl/release/kiln
          "$bin" --version
          # Rust's musl binaries are static-pie: file says "static-pie linked", ldd "statically linked".
          f=$(file "$bin"); l=$(ldd "$bin" 2>&1 || true)
          echo "$f"; echo "$l"
          echo "$f" | grep -Eq 'static(-pie|ally) linked' && ! echo "$f" | grep -q interpreter || { echo "musl build is not static"; exit 1; }
          echo "$l" | grep -Eq 'not a dynamic executable|statically linked' || { echo "musl build is not static"; exit 1; }
      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          for flavor in ":target/release/kiln" "-musl:target/x86_64-unknown-linux-musl/release/kiln"; do
            name="kiln-$v-x86_64-linux${flavor%%:*}"
            mkdir -p "dist/$name"
            cp "${flavor#*:}" README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "dist/$name/"
            cp -r deploy "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 1

  build-macos:
    # Off until the macOS build is proven on a real Mac: set the repository variable
    # KILN_MACOS_RELEASE to "true" to publish kiln-X.Y.Z-aarch64-macos.tar.gz with each release.
    if: vars.KILN_MACOS_RELEASE == 'true'
    runs-on: macos-14 # Apple Silicon
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main and matches Cargo.toml
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $want"; exit 1; }
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked && ./target/release/kiln --version
          file target/release/kiln | grep -q 'arm64' || { echo "not an arm64 binary"; exit 1; }
      - name: Package
        env:
          COPYFILE_DISABLE: "1" # no AppleDouble ._ files in the tarball
        run: |
          v="${GITHUB_REF_NAME#v}"
          name="kiln-$v-aarch64-macos"
          mkdir -p "dist/$name"
          cp target/release/kiln README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "dist/$name/"
          cp -r deploy "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-macos
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [build, build-macos]
    # build-macos is skipped unless KILN_MACOS_RELEASE is on; a failed or cancelled build never publishes.
    if: always() && needs.build.result == 'success' && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    runs-on: [self-hosted, kiln]
    environment: release
    permissions:
      contents: write
      id-token: write # attestation: OIDC token for Sigstore signing
      attestations: write
    steps:
      # Only reads files (CHANGELOG.md, PUBLIC_KEY in src/update.rs); nothing from the repo runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # dist (Linux) and, when built, dist-macos.
          pattern: dist*
          merge-multiple: true
          path: dist
      - name: Sign
        env:
          KEY: ${{ secrets.KILN_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "secret KILN_RELEASE_SIGNING_KEY is not set"; exit 1; }
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$KEY" > "$key"
          for t in dist/*.tar.gz; do
            /usr/bin/openssl pkeyutl -sign -inkey "$key" -rawin -in "$t" -out "$t.sig"
          done
          rm -f "$key"
      - name: Verify signatures with the key kiln embeds
        # A wrong secret must never publish: check against PUBLIC_KEY in src/update.rs, as kiln will.
        run: |
          raw=$(sed -n 's/^pub const PUBLIC_KEY: &str = "\(.*\)";/\1/p' src/update.rs)
          [ -n "$raw" ] || { echo "PUBLIC_KEY not found in src/update.rs"; exit 1; }
          pub=$(mktemp)
          # SubjectPublicKeyInfo DER for Ed25519 = fixed 12-byte prefix + the raw 32-byte key.
          { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; printf '%s' "$raw" | base64 -d; } > "$pub"
          [ "$(wc -c < "$pub")" -eq 44 ] || { echo "PUBLIC_KEY is not a raw 32-byte key"; exit 1; }
          for t in dist/*.tar.gz; do
            [ "$(wc -c < "$t.sig")" -eq 64 ] || { echo "$t.sig is not a 64-byte Ed25519 signature"; exit 1; }
            openssl pkeyutl -verify -pubin -keyform DER -inkey "$pub" -rawin -in "$t" -sigfile "$t.sig" \
              || { echo "$t: signature does not verify with kiln's embedded key (wrong KILN_RELEASE_SIGNING_KEY?)"; exit 1; }
          done
      - name: Attest build provenance
        # SLSA provenance for the tarballs, signed via Sigstore and stored by GitHub. Verify with:
        #   gh attestation verify kiln-X.Y.Z-x86_64-linux.tar.gz --repo Bunty9/kiln
        # Attestations need a public repo (or GHE Cloud), hence the gate while the repo is private.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 dist/*.sig --title "kiln $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"

  crates:
    # Publishes the same tagged source to crates.io as kiln-ci (`kiln` is taken there), after the
    # GitHub release is out. --no-verify: the build job already compiled this commit, so nothing
    # from the repo or its dependencies runs while the token is in the environment.
    needs: sign
    runs-on: [self-hosted, kiln]
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] || { echo "secret CARGO_REGISTRY_TOKEN is not set"; exit 1; }
          . "$HOME/.cargo/env"
          cargo publish --locked --no-verify
