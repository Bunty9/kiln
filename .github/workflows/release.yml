# Tag vX.Y.Z on main to publish a release. Built on kiln itself (Ubuntu 24.04 VM),
# so the binary needs glibc 2.39+ (Ubuntu 24.04, Debian 13 or newer).
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, kiln]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
      - name: Check tag matches Cargo.toml
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml $want"; exit 1; }
      - name: Build
        run: . "$HOME/.cargo/env" && cargo build --release --locked && ./target/release/kiln --version
      - name: Package
        run: |
          name="kiln-${GITHUB_REF_NAME#v}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/kiln README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "dist/$name/"
          cp -r deploy "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --title "kiln $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
