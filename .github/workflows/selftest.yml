# kiln self-test: run from the Actions tab (or `gh workflow run selftest.yml`).
# Reports what a job VM can reach and can fail on purpose to exercise
# debug hold (Settings > Debugging) and failure notifications.
name: selftest
on:
  workflow_dispatch:
    inputs:
      fail:
        description: Fail the job on purpose
        type: boolean
        default: false

jobs:
  probe:
    runs-on: [self-hosted, kiln]
    steps:
      - name: VM facts
        run: |
          nproc; free -m | head -2; df -h / | tail -1
          findmnt /mnt/cache || echo "no cache disk"
          ls -l /dev/kvm || echo "no nested kvm"
      - name: Network reach
        run: |
          probe() { if curl -s -m 4 -o /dev/null "$2"; then echo "reachable  $1"; else echo "blocked    $1"; fi; }
          probe "internet (github.com)"          https://github.com
          probe "docker mirror (10.0.2.2:5000)"  http://10.0.2.2:5000/v2/
          probe "kiln dashboard (10.0.2.2:7878)" http://10.0.2.2:7878/
          probe "LAN router (192.168.1.1)"       http://192.168.1.1/
          probe "tailnet (100.100.100.100)"      http://100.100.100.100/
      - name: Baked tools
        run: |
          ls /opt/hostedtoolcache/node; echo "bare node: $(node -v)"
          grep -q kiln-prejob.sh /home/runner/actions-runner/.env && echo "fork hook: installed" || echo "fork hook: missing"
          findmnt /var/cache/apt/archives >/dev/null && echo "apt archives: on cache disk" || echo "apt archives: not cached"
      # With 20 in bake_node_versions this logs "Found in cache" and downloads nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node -v
      - name: Fail on request
        if: ${{ inputs.fail }}
        run: |
          echo "failing on purpose so the VM can be held for debugging"
          exit 1
