[package]
name = "kiln"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "Self-hosted CI: a fresh rootless KVM virtual machine per GitHub Actions job, on hardware you own"
license = "MIT OR Apache-2.0"
authors = ["Bunty9"]
repository = "https://github.com/Bunty9/kiln"
readme = "README.md"
keywords = ["ci", "github-actions", "self-hosted", "kvm", "qemu"]
categories = ["command-line-utilities", "development-tools"]
# Distributed as GitHub Release binaries, not on crates.io.
publish = false

[profile.release]
strip = true
lto = "thin"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22"
bytes = "1.12.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
