#cloud-config
# Bake recipe for the kiln base image. Runs once (`kiln bake`), then the image
# is frozen; every job boots a throwaway qcow2 overlay of it.
# {{RUNNER_VERSION}} is filled in by kiln.
hostname: kiln
users:
  - name: runner
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
package_update: true
packages:
  - ca-certificates
  - curl
  - wget
  - git
  - git-lfs
  - jq
  - zstd
  - zip
  - unzip
  - xz-utils
  - rsync
  - openssh-client
  - build-essential
  - pkg-config
  - cmake
  - python3
  - python3-pip
  - python3-venv
  - pipx
  - docker.io
  - docker-buildx
  - docker-compose-v2
write_files:
  - path: /usr/local/sbin/kiln-bake
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euxo pipefail
      V={{RUNNER_VERSION}}
      usermod -aG docker runner
      mkdir -p /home/runner/actions-runner /opt/hostedtoolcache
      curl -fsSL "https://github.com/actions/runner/releases/download/v$V/actions-runner-linux-x64-$V.tar.gz" \
        | tar -xz -C /home/runner/actions-runner
      /home/runner/actions-runner/bin/installdependencies.sh
      printf 'RUNNER_TOOL_CACHE=/opt/hostedtoolcache\nAGENT_TOOLSDIRECTORY=/opt/hostedtoolcache\nLANG=C.UTF-8\n' \
        > /home/runner/actions-runner/.env
      chown -R runner:runner /home/runner /opt/hostedtoolcache
      # Boot speed: nothing a CI job needs, all of it slow.
      apt-get purge -y snapd unattended-upgrades || true
      systemctl mask apt-daily.timer apt-daily-upgrade.timer man-db.timer motd-news.timer \
        e2scrub_reap.service fwupd-refresh.timer
      apt-get clean
      systemctl enable kiln-job.service
      touch /etc/cloud/cloud-init.disabled
      cloud-init clean --logs --machine-id
      echo KILN_BAKE_OK > /dev/ttyS0
  - path: /usr/local/sbin/kiln-job
    permissions: "0755"
    content: |
      #!/bin/bash
      # Boot entry of a job VM: read the JIT config kiln passed as an SMBIOS
      # OEM string, run exactly one job, power off. QEMU exits and the
      # overlay is deleted.
      jit=$(dmidecode -q -t 11 | sed -n 's/^[[:space:]]*String [0-9]*: kiln.jit=//p')
      if [ -z "$jit" ]; then
        echo "kiln: no JIT config passed, powering off"
      else
        /usr/local/sbin/kiln-steps &
        cd /home/runner/actions-runner
        sudo -u runner ./run.sh --jitconfig "$jit"
        echo "kiln: runner exited with $?"
        sleep 1 # let kiln-steps flush the last page
      fi
      sync
      echo o > /proc/sysrq-trigger
  - path: /usr/local/sbin/kiln-steps
    permissions: "0755"
    content: |
      #!/bin/bash
      # Mirror live step output (runner _diag/pages/*.log) to the second serial
      # port, which kiln saves as steps.log. The runner deletes a page once
      # uploaded, so poll fast and simply forget files that vanish.
      pages=/home/runner/actions-runner/_diag/pages
      declare -A off
      exec >/dev/ttyS1
      while sleep 0.3; do
        for f in "$pages"/*.log; do
          size=$(stat -c %s "$f" 2>/dev/null) || continue
          o=${off[$f]:-0}
          if [ "$size" -gt "$o" ]; then
            tail -c +$((o + 1)) "$f" 2>/dev/null | head -c $((size - o))
            off[$f]=$size
          fi
        done
      done
  - path: /etc/systemd/system/kiln-job.service
    content: |
      [Unit]
      Description=kiln: run one GitHub Actions job
      Wants=network-online.target docker.service
      After=network-online.target docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/kiln-job
      StandardOutput=journal+console
      StandardError=journal+console

      [Install]
      WantedBy=multi-user.target
runcmd:
  - [/usr/local/sbin/kiln-bake]
power_state:
  mode: poweroff
  condition: true
