<!doctype html>
<html lang="en">
<head>

<meta name="color-scheme" content="dark light">
<title>kiln</title>
<link rel="icon" id="fav" href="data:,">
<script>
// Appearance (Settings › Appearance) lives in this browser only. Applied before first paint.
(function () {
  var d = document.documentElement, m = matchMedia('(prefers-color-scheme: light)');
  var g = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  function apply() {
    var t = g('kiln-theme') || 'system', a = g('kiln-accent');
    d.dataset.scheme = t === 'system' ? (m.matches ? 'light' : 'dark') : t;
    d.dataset.density = g('kiln-density') || 'comfortable';
    d.dataset.motion = g('kiln-motion') || 'system';
    if (a && a !== 'ember') d.dataset.accent = a; else delete d.dataset.accent;
  }
  apply(); if (m.addEventListener) m.addEventListener('change', apply);
  window.kilnAppearance = apply;
})();
</script>
<style>
/* ---------- tokens ---------- */
:root{color-scheme:dark;
 /* surfaces, low to high: page, card, raised (buttons, menus), overlay */
 --bg:#14110E;--s1:#1C1814;--s2:#252019;--s3:#2E2820;--sunk:#0F0D0A;
 --surface:var(--s1);--raised:var(--s2);
 --line:rgb(255 232 205/.075);--line-strong:rgb(255 232 205/.15);
 --fg:#EEE7DE;--fg-2:#B6AB9E;--fg-3:#978C80;
 /* state palette; --ember is "running" and the logo, never the UI accent */
 --ember:#F59E4C;--ok:#5DBE8A;--fail:#F07068;--queued:#97A9C4;--warn:#E2C35A;--info:#97A9C4;
 --acc-d:#F59E4C;--acc-l:#A34B07;--accent:var(--acc-d);--on-accent:#16130F;--on-ember:var(--on-accent);
 --tint:15%;
 --hi:inset 0 1px 0 rgb(255 240 220/.045);
 --e1:var(--hi),0 1px 2px rgb(0 0 0/.45),0 0 0 1px rgb(255 232 205/.05);
 --e2:var(--hi),0 1px 2px rgb(0 0 0/.4),0 6px 16px -4px rgb(0 0 0/.5),0 0 0 1px rgb(255 232 205/.07);
 --e3:0 4px 12px rgb(0 0 0/.4),0 18px 44px -8px rgb(0 0 0/.7),0 0 0 1px rgb(255 232 205/.1);
 --pop:var(--e3);
 --focus:0 0 0 2px var(--bg),0 0 0 4px var(--accent);
 --r1:6px;--r2:10px;--r3:14px;
 --pad:20px;--row:48px;--gap:16px;--sec:32px;
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
 --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
 --ease:140ms cubic-bezier(.2,0,0,1);--tabh:calc(56px + env(safe-area-inset-bottom));
}
:root[data-scheme=light]{color-scheme:light;
 --bg:#F4F3F1;--s1:#FFF;--s2:#FFF;--s3:#FBFAF8;--sunk:#ECEAE6;
 --line:rgb(70 50 30/.1);--line-strong:rgb(70 50 30/.2);
 --fg:#1C1813;--fg-2:#5A5248;--fg-3:#6B6258;
 --ember:#A34B07;--ok:#136A40;--fail:#BE2D25;--queued:#466186;--warn:#805A00;--info:#466186;
 --accent:var(--acc-l);--on-accent:#FFF;--tint:10%;
 --hi:inset 0 0 0 0 transparent;
 --e1:0 0 0 1px rgb(70 50 30/.07),0 1px 2px rgb(70 50 30/.07);
 --e2:0 0 0 1px rgb(70 50 30/.08),0 1px 2px rgb(70 50 30/.06),0 6px 16px -6px rgb(70 50 30/.18);
 --e3:0 0 0 1px rgb(70 50 30/.08),0 4px 12px rgb(70 50 30/.08),0 20px 44px -10px rgb(70 50 30/.3);
}
/* accents: kiln glazes, each with a dark- and light-theme value that keeps AA on its fill */
:root[data-accent=flame]{--acc-d:#F27B52;--acc-l:#B0391A}
:root[data-accent=brass]{--acc-d:#E2B657;--acc-l:#7E5E0A}
:root[data-accent=celadon]{--acc-d:#74C6B1;--acc-l:#1B6B5B}
:root[data-accent=cobalt]{--acc-d:#8EAAF4;--acc-l:#3354B5}
:root[data-density=compact]{--pad:14px;--row:38px;--gap:12px;--sec:24px}
/* ---------- base ---------- */
*{box-sizing:border-box}
html{scrollbar-gutter:stable;overflow-y:scroll}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,dl,dd{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:0;box-shadow:var(--focus)}
[hidden]{display:none!important}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.mono{font-family:var(--mono)}.fg2{color:var(--fg-2)}.fg3{color:var(--fg-3)}.sm{font-size:12px}.sp{flex:1}
.ok{color:var(--ok)}.fail{color:var(--fail)}.warn{color:var(--warn)}.q{color:var(--queued)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.i.l{width:20px;height:20px}
code{font:12.5px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 1px 0 var(--line)}
.top>div{max-width:1120px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:24px}
.logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:650;letter-spacing:-.01em;text-decoration:none;border-radius:var(--r1)}
.nav{display:flex;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;color:var(--fg-2);text-decoration:none;font-size:13px;font-weight:500;transition:background var(--ease),color var(--ease),box-shadow var(--ease)}
.nav a .i{opacity:.8}
.nav a:hover{color:var(--fg);background:var(--s1)}
.nav a[aria-current]{color:var(--fg);background:var(--s2);box-shadow:var(--e1)}
.nav a[aria-current] .i{color:var(--accent);opacity:1}
.cdot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:auto;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.cdot::after{content:"";position:absolute;inset:-10px}
.cdot.bad{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
#conn{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:30;width:min(560px,calc(100vw - 32px))}
#conn .bn{margin:0;box-shadow:var(--e3),inset 3px 0 var(--c);background:color-mix(in srgb,var(--c) 14%,var(--s2))}
body.down main{opacity:.6}
main{max-width:1120px;margin:0 auto;padding:24px 16px 56px;transition:opacity var(--ease)}
/* page header: identical height on every page so titles never jump */
.ph{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;min-height:36px;margin-bottom:20px}
.ph h1{font-size:22px;font-weight:650;line-height:1.25;letter-spacing:-.015em;min-width:0;overflow-wrap:anywhere}
.ph .sub-h{color:var(--fg-2);font-size:13px}
.back{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:-2px;border-radius:8px;color:var(--fg-2);text-decoration:none;flex:none;transition:background var(--ease),color var(--ease)}
.back:hover{color:var(--fg);background:var(--s2);box-shadow:var(--e1)}
.lead{color:var(--fg-2);margin:-8px 0 20px;max-width:68ch}
.ov{display:grid;gap:24px 32px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.ov{grid-template-columns:minmax(0,1fr) 280px}.ov>aside{position:sticky;top:80px;align-self:start}}
.sec{margin-top:var(--sec)}.sec:first-child{margin-top:0}
.sec>h2,.card h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;letter-spacing:-.005em}
/* ---------- surfaces ---------- */
.card{background:var(--s1);border-radius:var(--r2);padding:var(--pad);box-shadow:var(--e1)}
.card+.card{margin-top:var(--gap)}
.card .card{background:var(--s3);box-shadow:none;outline:1px solid var(--line)}
.hair>*+*{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
#ov-st:not(:empty){margin-bottom:var(--gap)}
.stline{color:var(--fg-2);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.stline .d{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.stline .d.w{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent)}
.ph .stline{margin-left:auto}
@media(max-width:719px){.ph .stline{margin-left:0;width:100%}}
/* banners: elevated, a colour bar on the left says how urgent */
.bn{--c:var(--warn);display:flex;align-items:center;gap:12px 16px;min-height:48px;padding:8px 12px 8px 16px;margin-bottom:8px;border-radius:var(--r2);background:color-mix(in srgb,var(--c) 9%,var(--s1));box-shadow:var(--e1),inset 3px 0 var(--c);font-size:13px}
.bn>.i{color:var(--c)}
.bn>span{flex:1;min-width:0;overflow-wrap:anywhere}
.bn .btn{flex:none}
.bn.cta{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,var(--s1)),var(--s1) 70%);--c:var(--accent);min-height:56px}
@media(max-width:719px){.bn{flex-wrap:wrap}.bn>span{flex-basis:calc(100% - 32px)}.bn .btn{margin-left:28px}}
.ph-steps{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px;color:var(--fg-2);font-size:12px}
.ph-steps b{color:var(--fg)}
/* VM slots */
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ch{height:64px;border-radius:var(--r2);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--fg-3);font-size:13px;text-decoration:none;background:repeating-linear-gradient(-45deg,transparent 0 6px,var(--line) 6px 7px);box-shadow:inset 0 0 0 1px var(--line)}
a.ch{background:var(--s1);color:var(--fg);box-shadow:var(--e1),inset 0 2px var(--queued);transition:box-shadow var(--ease),background var(--ease)}
a.ch:hover{box-shadow:var(--e2),inset 0 2px var(--queued);background:var(--s2)}
/* the one warm moment: a running slot glows like a loaded kiln */
a.ch.run{background:radial-gradient(130% 150% at 50% 135%,color-mix(in srgb,var(--ember) 30%,transparent),transparent 62%),var(--s1);box-shadow:var(--e1),inset 0 2px var(--ember)}
a.ch.run:hover{box-shadow:var(--e2),inset 0 2px var(--ember)}
.ch .tx{flex:1;min-width:0}.ch .tx>*{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .tm{font-size:17px;font-weight:600;letter-spacing:-.01em}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border-radius:var(--r2);overflow:hidden;box-shadow:var(--e1)}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--s1);padding:14px var(--pad) 16px;min-height:76px;text-decoration:none;display:block;transition:background var(--ease)}
.stat .l{font-size:12px;color:var(--fg-2)}.stat .v{font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-.02em;margin-top:2px}
a.stat:hover{background:var(--s2)}
.stat:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.foot{margin-top:8px;font-size:12px;color:var(--fg-2)}
.lnk{background:none;border:0;padding:0;cursor:pointer;color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-underline-offset:3px;border-radius:3px}
.lnk:hover{text-decoration-color:currentColor}
.meter{padding:0}.meter .l{display:flex;justify-content:space-between;font-size:13px}
.meter .b{height:6px;background:var(--sunk);border-radius:3px;margin-top:6px;overflow:hidden;box-shadow:inset 0 1px 1px rgb(0 0 0/.15)}
.meter .b i{display:block;height:100%;border-radius:3px;background:var(--fg-3);transition:width var(--ease)}
.meter.hot .b i{background:var(--warn)}
/* lists */
.list{list-style:none;padding:0;background:var(--s1);border-radius:var(--r2);overflow:hidden;box-shadow:var(--e1)}
.list>li{position:relative;border-top:1px solid var(--line)}.list>li:first-child{border-top:0}
.row{display:grid;grid-template-columns:104px minmax(0,1fr) 110px 80px;align-items:center;gap:0 12px;min-height:var(--row);padding:8px 16px;font-size:13px;text-decoration:none;transition:background var(--ease)}
a.row:hover,li:hover>.row{background:var(--s2)}
.row[aria-current]{box-shadow:inset 3px 0 var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--s1))}
.row .tt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .tt .r{color:var(--fg-2);font-weight:400}.row .id{display:block;font:12px var(--mono);color:var(--fg-3)}
.row .w{color:var(--fg-2)}.row .d{text-align:right}.row .m{display:none}
:root[data-density=compact] .row{padding-top:4px;padding-bottom:4px}
@media(max-width:719px){
 .row{grid-template-columns:96px minmax(0,1fr);grid-template-areas:"b t" "b m";gap:2px 12px;min-height:56px}
 .row .bd{grid-area:b;align-self:start;padding-top:2px}.row .t{grid-area:t}.row .m{grid-area:m;display:block;font-size:12px;color:var(--fg-2)}
 .row .w,.row .d,.row .id{display:none}
}
.rr{grid-template-columns:minmax(0,1fr) 160px 104px 80px}
.rr .nm{font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .nm::after{content:"";position:absolute;inset:0}
.rr .rt,.rr .lr,.rr .qn{position:relative;z-index:1}
.rr .qn{text-align:right;color:var(--queued)}
@media(max-width:719px){.rr{grid-template-areas:"n n" "r l";grid-template-columns:auto auto;justify-content:start;gap:4px 12px}.rr .nm{grid-area:n}.rr .rt{grid-area:r}.rr .lr{grid-area:l}.rr .qn{display:none}}
.sn{padding:0 16px 16px}
@media(max-width:719px){.row.flat{grid-template-areas:none!important}.row.flat>*{grid-area:auto!important}.row.flat .id{display:block}.row.flat.bf{grid-template-columns:auto minmax(0,1fr) auto!important}}
.pr{grid-template-columns:minmax(0,1fr) 190px 90px 80px;grid-template-areas:"n c s p" "g g g g"}
.pr .pc{grid-area:c}.pr .ps{grid-area:s}
@media(max-width:719px){.pr{grid-template-areas:"n p" "c c" "s s" "g g";grid-template-columns:minmax(0,1fr) auto}.pr .id{display:block}}
.pg{margin-top:4px;font:12px var(--mono);color:var(--fg-2);grid-area:g;white-space:pre-wrap;overflow-wrap:anywhere}
/* badges: one component, colour + icon + word */
.bdg{--c:var(--fg-2);display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border-radius:999px;font:500 12px/22px var(--sans);color:var(--c);background:color-mix(in srgb,var(--c) var(--tint),transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent);white-space:nowrap}
.bdg .i{width:14px;height:14px;stroke-width:1.75}
.bdg.nd{padding-left:8px}
.s-running{--c:var(--ember)}.s-booting,.s-waiting,.s-queued{--c:var(--queued)}.s-passed,.s-ok{--c:var(--ok)}.s-failed{--c:var(--fail)}.s-lost,.s-warn,.s-held{--c:var(--warn)}
.s-running .i{animation:br 1.6s ease-in-out infinite alternate}
@keyframes br{from{opacity:.5}to{opacity:1}}
@keyframes spin{to{transform:rotate(1turn)}}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 4px 0 10px;border-radius:999px;background:var(--s2);box-shadow:var(--e1);font-size:13px}
.chip button{display:inline-grid;place-items:center;width:20px;height:20px;background:none;border:0;padding:0;border-radius:50%;cursor:pointer;color:var(--fg-2)}
.chip button:hover{background:var(--s3);color:var(--fg)}
.chip.jump{padding:0 12px;height:30px;gap:6px}
.tag{font-size:12px;color:var(--warn);margin-left:8px}
/* buttons */
.btn{height:32px;padding:0 12px;border-radius:8px;border:0;background:var(--s2);box-shadow:var(--e1);cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap;transition:background var(--ease),box-shadow var(--ease),color var(--ease)}
.btn:hover{background:var(--s3);box-shadow:var(--e2)}
.btn:active{box-shadow:var(--e1);transform:translateY(.5px)}
.btn:focus-visible{box-shadow:var(--focus)}
.btn.pri{background:var(--accent);color:var(--on-accent);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/.25),inset 0 1px 0 rgb(255 255 255/.18)}
.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,var(--fg))}
.btn.dng{color:var(--fail)}.btn.dng:hover{background:color-mix(in srgb,var(--fail) 12%,var(--s2))}
.btn.dng.fill{background:var(--fail);color:#fff}
:root:not([data-scheme=light]) .btn.dng.fill{color:#16130F}
.btn.ic{width:32px;padding:0}
.btn[disabled]{opacity:.55;cursor:default;transform:none}
.btn[aria-busy=true] .i{animation:spin .9s linear infinite}
@media(max-width:719px){.btn{height:40px}.btn.ic{width:40px}}
/* inputs */
input[type=text],input[type=number],input[type=password],input:not([type]),select,textarea{border-radius:8px;border:0;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line-strong);transition:box-shadow var(--ease)}
input[type=text],input[type=number],input[type=password],input:not([type]),select{height:32px;padding:0 10px;min-width:0;max-width:100%}
textarea{font:inherit;color:inherit;padding:8px 10px;max-width:100%;resize:vertical}
input:hover,select:hover,textarea:hover{box-shadow:inset 0 0 0 1px var(--fg-3)}
input:focus-visible,select:focus-visible,textarea:focus-visible{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
input::placeholder,textarea::placeholder{color:var(--fg-3)}
input[type=file]{font-size:13px;max-width:100%}
@media(max-width:719px){input[type=text],input[type=number],input[type=password],input:not([type]),select{height:40px;font-size:16px}}
input[role=switch]{appearance:none;flex:none;width:34px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;box-shadow:inset 0 1px 2px rgb(0 0 0/.2);transition:background var(--ease)}
input[role=switch]::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.3);transition:transform var(--ease)}
input[role=switch]:checked{background:var(--accent)}input[role=switch]:checked::after{transform:translateX(14px);background:var(--on-accent)}
input[role=switch]:focus-visible{box-shadow:var(--focus)}
input[role=switch]:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;box-shadow:inset 0 1px 2px rgb(0 0 0/.12)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--fg-2);cursor:pointer;font-size:13px;font-weight:500;transition:background var(--ease),color var(--ease),box-shadow var(--ease)}
.seg button:hover{color:var(--fg)}
.seg button[aria-checked=true]{background:var(--s2);color:var(--fg);box-shadow:var(--e1)}.seg button[disabled]{color:var(--fg-3);cursor:default}
.seg button:focus-visible{box-shadow:var(--focus)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:var(--gap)}
/* callouts and empty states */
.cal{--c:var(--fail);padding:12px 16px;border-radius:var(--r1);background:color-mix(in srgb,var(--c) 9%,var(--s1));box-shadow:inset 3px 0 var(--c);font-size:13px;overflow-wrap:anywhere;margin:16px 0}
.cal.neu{--c:var(--fg-3)}.cal.w{--c:var(--warn)}.cal.o{--c:var(--ok)}.cal.a{--c:var(--accent)}
.empty{padding:28px 0;display:flex;flex-direction:column;align-items:flex-start;gap:12px;color:var(--fg-2)}
.empty>.i{width:28px;height:28px;color:var(--fg-3);stroke-width:1.25}
.empty p{max-width:60ch}
.empty .acts{display:flex;flex-wrap:wrap;gap:8px}
/* job page and the firing log (timeline) */
.jm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin:-8px 0 20px;font-size:12px;color:var(--fg-2)}
.tl{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.tl i{display:block;min-width:4px;background:var(--queued);outline:0}
.tl i:first-child{border-radius:5px 0 0 5px}.tl i:last-child{border-radius:0 5px 5px 0}
.tl i:focus-visible{box-shadow:inset 0 0 0 2px var(--fg)}

const GUIDES = [

    <p>You need three things:</p>
    <ol><li><b>A GitHub token</b> (Settings › GitHub), so kiln can see queued jobs.</li><li><b>The base image</b> that every VM starts from. It is built once (~4 min) and refreshed automatically.</li><li><b>A repo</b> (Repos) with a job that says <code>runs-on: [self-hosted, ${L}]</code>.</li></ol>
    <p>Setup walks you through all three and can open a test pull request for you.</p><p><a class="btn" href="#/setup">Open setup</a></p>

    <p>For another size, use exactly one size label:</p>
    <div class="tw"><table><tr><th>runs-on</th><th>vCPU</th><th>RAM</th></tr><tr><td><code>[self-hosted, ${L}]</code></td><td>${D}</td><td>default</td></tr>
    ${[[2, 4], [4, 8], [8, 16], [16, 24]].map(([c, m]) => `<tr><td><code>[self-hosted, ${L}-${c}cpu]</code></td><td>${c}</td><td>${m} GB</td></tr>`).join('')}</table></div>
    <ul><li>Never combine labels: <code>[${L}, ${L}-8cpu]</code> is never picked up.</li><li>A size above this box's CPU count waits forever.</li><li>Each job gets a fresh VM. Install steps rerun every time, but downloads come from the repo cache.</li><li>To skip the ~10 s boot, keep <b>warm VMs</b> ready: Repos › your repo › Warm VMs. They hold memory while idle and are recycled so they never go stale.</li></ul>

    <p>Each repo has one cache disk, which every job gets. It holds Docker layers, <code>~/.cache</code>, <code>~/.npm</code>, Cargo and the Rust toolchain (<code>~/.cargo</code>, <code>~/.rustup</code>), Go modules, Gradle and Maven. You don't need to change your workflow.</p>
    <p><b>Trust rule:</b> every job reads the cache, but changes are saved only when the job succeeded <i>and</i> it was a push to the default branch, or to one of the repo's <b>cache branches</b> (Repos › your repo). Pull requests start warm, but their changes are discarded, so they can't poison the cache. The job page says why, e.g. "Cache: read-only (pull_request event)".</p>

/* ---------- tooltips: one #tip element for every [data-tip], on hover and on keyboard focus ---------- */
const tipEl = $('#tip');
let tipFor = null, tipWant = null, tipT = 0;
function showTip(el) {
  const t = el.dataset.tip; if (!t || !el.isConnected) return;
  tipFor = el; tipEl.textContent = t; tipEl.classList.add('on');
  if (!el.hasAttribute('aria-describedby')) el.setAttribute('aria-describedby', 'tip');
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight, cw = document.documentElement.clientWidth;
  const x = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, cw - w - 8));
  const y = r.top - h - 8 >= 8 ? r.top - h - 8 : Math.min(r.bottom + 8, innerHeight - h - 8);
  tipEl.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`;
}
function hideTip() {
  clearTimeout(tipT); tipWant = null; if (!tipFor) return;
  if (tipFor.getAttribute('aria-describedby') === 'tip') tipFor.removeAttribute('aria-describedby');
  tipFor = null; tipEl.classList.remove('on');
}
document.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch') return;
  const el = e.target.closest?.('[data-tip]'); if (el === tipWant || (el && el === tipFor)) return;
  hideTip(); if (el) { tipWant = el; tipT = setTimeout(() => showTip(el), 400); }
});
document.addEventListener('pointerout', e => { const el = e.target.closest?.('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { const el = e.target; hideTip(); if (el.dataset?.tip && el.matches(':focus-visible')) showTip(el); });
document.addEventListener('focusout', hideTip);
// Touch: tap a hint-only element (badge, stat, timeline) to read its tip; any next tap hides it.
document.addEventListener('pointerdown', e => {
  const el = e.target.closest?.('[data-tip]'); hideTip();
  if (e.pointerType === 'touch' && el && !el.closest('a,button,input,select,label')) { showTip(el); tipT = setTimeout(hideTip, 4000); }
});
addEventListener('scroll', hideTip, true);
addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
