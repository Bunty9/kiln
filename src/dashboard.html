<style>

}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}

}

.pg{margin-top:4px;font:12px var(--mono);color:var(--fg-2);grid-area:g;white-space:pre-wrap;overflow-wrap:anywhere}

.tl .q{opacity:.5}.tl .w{background:var(--line-strong)}.tl .j-ok{background:var(--ok)}.tl .j-fail{background:var(--fail)}.tl .j-run{background:var(--ember)}
.tll{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}

.lv{margin-top:16px;scroll-margin-top:64px}
.row:focus-visible{box-shadow:inset 0 0 0 2px var(--ember)}
.lt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}

.a1{font-weight:600}.a2{opacity:.7}.a30,.a90{color:var(--fg-3)}.a31,.a91{color:var(--fail)}.a32,.a92{color:var(--ok)}.a33,.a93{color:var(--warn)}.a34,.a36,.a94,.a96{color:var(--queued)}.a35,.a95{color:var(--ember)}.a37,.a97{color:var(--fg)}

.set{display:grid;gap:32px;grid-template-columns:200px minmax(0,1fr)}

/* ---------- guides ---------- */
const GUIDES = [
  ['start', 'Getting started', L => `<h2>Getting started</h2>
    <p>When GitHub queues a job whose <code>runs-on</code> names kiln, kiln boots a fresh Ubuntu 24.04 VM on this box and registers a single-use runner. It runs one job, then the VM is deleted.</p>
    <p>You need three things:</p>
    <ol><li><b>A GitHub token</b> (Settings › GitHub), so kiln can see queued jobs.</li><li><b>The base image</b> that every VM starts from. It is built once (~4 min) and refreshed automatically.</li><li><b>A repo</b> (Repos) with a job that says <code>runs-on: [self-hosted, ${L}]</code>.</li></ol>
    <p>Setup walks you through all three and can open a test pull request for you.</p><p><a class="btn" href="#/setup">Open setup</a></p>
    <p>Day to day, glance at Overview: banners mean something needs you.</p>`],
  ['move', 'Move a workflow to kiln', (L, D) => `<h2>Move a workflow to kiln</h2><p>Change one line per job:</p>
    ${cb(`jobs:\n  test:\n    runs-on: [self-hosted, ${L}]   # was: ubuntu-latest`)}
    <p>For another size, use exactly one size label:</p>
    <div class="tw"><table><tr><th>runs-on</th><th>vCPU</th><th>RAM</th></tr><tr><td><code>[self-hosted, ${L}]</code></td><td>${D}</td><td>default</td></tr>
    ${[[2, 4], [4, 8], [8, 16], [16, 24]].map(([c, m]) => `<tr><td><code>[self-hosted, ${L}-${c}cpu]</code></td><td>${c}</td><td>${m} GB</td></tr>`).join('')}</table></div>
    <ul><li>Never combine labels: <code>[${L}, ${L}-8cpu]</code> is never picked up.</li><li>A size above this box's CPU count waits forever.</li><li>Each job gets a fresh VM. Install steps rerun every time, but downloads come from the repo cache.</li><li>To skip the ~10 s boot, keep <b>warm VMs</b> ready: Repos › your repo › Warm VMs. They hold memory while idle and are recycled so they never go stale.</li></ul>
    <p>Docker, <code>services:</code>, <code>container:</code> and <code>sudo</code> work as on GitHub-hosted Ubuntu. macOS, Windows and GPUs are not supported.</p>`],
  ['debug', 'Debug a failed job', () => `<h2>Debug a failed job</h2><p>Each job page has three logs:</p>
    <ul><li><b>Console:</b> boot and runner output (start here if the job never started).</li><li><b>Steps:</b> your steps, live.</li><li><b>GitHub:</b> the final log.</li></ul>
    <p>The note under the timeline says why the VM stopped.</p><p>To get a shell in a failed job's VM:</p>
    <ol><li>In Settings › Debugging, set <i>Hold failed jobs</i> (e.g. 30 min) and add your SSH public key.</li><li>Rerun the job. If it fails, its VM stays up and the job page shows a command like this:${cb('ssh -p 2201 runner@100.73.48.98')}</li>
    <li>Compare the host key fingerprints shown on the page, then connect from any tailnet device. Login is key-only, as <code>runner</code>.</li><li>Click <b>Release now</b> when you're done. A held VM keeps its memory and slot.</li></ol>
    <p>If holds stop working after you update kiln, rebake the image.</p>`],
  ['cache', 'Caching', () => `<h2>Caching</h2>
    <p>Each repo has one cache disk, which every job gets. It holds Docker layers, <code>~/.cache</code>, <code>~/.npm</code>, Cargo and the Rust toolchain (<code>~/.cargo</code>, <code>~/.rustup</code>), Go modules, Gradle and Maven. You don't need to change your workflow.</p>
    <p><b>Trust rule:</b> every job reads the cache, but changes are saved only when the job succeeded <i>and</i> it was a push to the default branch, or to one of the repo's <b>cache branches</b> (Repos › your repo). Pull requests start warm, but their changes are discarded, so they can't poison the cache. The job page says why, e.g. "Cache: read-only (pull_request event)".</p>
    <p><b>Size:</b> set in Settings › Cache (default 30 GB). A cache that grows past 1.2× its size is reset.</p>
    <p><b>Clear:</b> Settings › Cache › Clear. It is refused while that repo has jobs running. Clear after resizing.</p>`],
  ['network', 'Network & security', () => `<h2>Network &amp; security</h2><p><b>What jobs can reach</b> (Settings › Network):</p>
    <ul><li><b>Open</b> (default): anything this box can reach, including your LAN and tailnet.</li><li><b>Filtered:</b> only the internet, DNS and the Docker mirror. LAN, tailnet, this box, cloud metadata and port 25 are blocked; IPv6 is off. If the filter fails, nothing launches. The host needs these packages:${cb('sudo apt install rootlesskit slirp4netns nftables uidmap')}</li></ul>
    <p>Use Filtered before running pull requests from forks.</p><p><b>Who can open this dashboard:</b></p>
    <ul><li>Tailnet devices are let in by their Tailscale login. By default that is only this box's owner; see Settings › Access.</li><li>A browser on the CI box itself needs the key from <code>~/.local/share/kiln/dashboard.key</code>.</li><li>LAN access is always refused.</li></ul>`],
  ['image', 'Keeping the image fresh', () => `<h2>Keeping the image fresh</h2>
    <p>Every job boots from one base image: Ubuntu 24.04 with Docker, build tools and a pinned Actions runner.</p>
    <p><b>Why rebake:</b> GitHub stops sending jobs to runners that are about 30 days out of date. The image is <i>stale</i> when its runner is behind GitHub's latest, it is over 25 days old, the baked Node versions or apt packages changed, or an older kiln baked it.</p>
    <p><b>Auto rebake</b> (on by default) rebuilds a stale image by itself, at most every 6 hours. Jobs that queue meanwhile run on the old image until the new one is swapped in.</p>
    <p><b>By hand:</b> Settings › Image › Rebake image. It takes ~4 minutes, and the bake log shows progress. Running jobs aren't affected.</p>
    <p>Also rebake after updating kiln. For extra tools in every VM, edit <code>guest/user-data.yaml</code> and rebake.</p>`],
  ['stuck', 'Troubleshooting', L => `<h2>Troubleshooting</h2><p><i>A job stays queued.</i> Check these in order:</p>
    <ol><li><b>Labels:</b> <code>[self-hosted, ${L}]</code> or one size label, never both, and no size above this box's CPUs.</li>
    <li><b>Repo:</b> it is listed on Repos with no access error. Fine-grained tokens need Administration: write and Actions: read/write.</li>
    <li><b>Paused or full:</b> Max VMs 0 means paused. Otherwise every slot may be busy, held for debugging, or taken by warm VMs.</li>
    <li><b>Overview banners:</b><ul><li><i>Not launching VMs:</i> kiln is holding back, e.g. memory is too low for another VM.</li><li><i>Launches paused after N failures:</i> VMs failed to start. kiln retries by itself; read the Console log.</li><li><i>Rate limit:</i> polling resumes at the time shown.</li></ul></li>
    <li><b>Filtered network failing its check:</b> nothing launches until it passes.</li><li><b>Runner too old:</b> rebake.</li></ol>
    <p><b>Diagnostics</b> runs <code>kiln doctor</code>: KVM and tools, disk and memory headroom, image and token, Docker mirror and Tailscale, and filtered egress.</p>`],
];

document.addEventListener('click', async e => {
  if (popEl && !popEl.contains(e.target) && !e.target.closest('[data-act=rate],[data-act=runwf],[data-act=help]')) closePop();
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || b.tagName === 'OPTION') return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  if (b.tagName !== 'INPUT' && b.tagName !== 'A') e.preventDefault();
  if (b.tagName === 'BUTTON' && !b.classList.contains('hq')) b.disabled = true;
  try { await fn(b); } catch (err) { fail(err); if (b.type === 'checkbox') b.checked = !b.checked; } finally { if (b.tagName === 'BUTTON' && b.isConnected) b.disabled = false; }
});
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT' && ACT[e.target.dataset.act]) ACT[e.target.dataset.act](e.target); });
document.addEventListener('input', e => {

  if (k === 'bake_node_versions' || k === 'bake_apt_packages') draft[k] = t.value.split(',').map(x => x.trim()).filter(Boolean); else
  if (k === 'size_mem_gb') draft.size_mem_mb = Object.fromEntries(t.value.split(',').map(x => x.split('=').map(y => +y.trim())).filter(([n, g]) => n > 0 && g > 0).map(([n, g]) => [n, Math.round(g * 1024)])); else
  if (k === 'vm_mem_gb') draft.vm_mem_mb = Math.round(v * 1024); else draft[k] = v;
  pages.settings.live();
});
document.addEventListener('keydown', e => {

document.addEventListener('submit', async e => {
